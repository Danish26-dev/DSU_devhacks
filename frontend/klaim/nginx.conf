# nginx config for the KLAIM PWA on Cloud Run.
# ${PORT} is substituted by the nginx:alpine entrypoint (envsubst) at start.
server {
  listen       ${PORT};
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # gzip for text assets.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  # The service worker must never be cached, or clients get stuck on an old one.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # Manifest served with the correct type; short cache.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Hashed build assets are immutable — cache hard.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback: any unknown path serves index.html so client-side routes
  # (/app/verify, /verifier/..., etc.) work on direct load / refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
